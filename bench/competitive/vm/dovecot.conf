dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
base_dir = /Users/admin/bench-mail/run
state_dir = /Users/admin/bench-mail/state
log_path = /Users/admin/bench-mail/dovecot.log
protocols = imap
listen = 127.0.0.1
ssl = no
auth_allow_cleartext = yes
default_internal_user = admin
default_internal_group = staff
default_login_user = admin
mail_driver = maildir
mail_path = /Users/admin/bench-mail/maildir
mail_uid = admin
mail_gid = staff
first_valid_uid = 1
passdb static {
  fields {
    nopassword = yes
  }
}
userdb static {
  fields {
    uid = admin
    gid = staff
    home = /Users/admin/bench-mail/home
  }
}
service imap-login {
  chroot =
  inet_listener imap {
    port = 1143
  }
  # Mail's account setup only tries the standard port.
  inet_listener imap_standard {
    port = 143
  }
}
service anvil {
  chroot =
}
service auth {
  user = admin
}
service auth-worker {
  user = admin
}
default_vsz_limit = unlimited
